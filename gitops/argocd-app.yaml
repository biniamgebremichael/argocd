apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-node-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/biniamgebremichael/argocd.git'
    targetRevision: HEAD
    path: gitops
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true