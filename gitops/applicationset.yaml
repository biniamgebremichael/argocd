apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hello-node-environments
  namespace: argocd
spec:
  generators:
    - list:
        # This list instructs Argo CD to generate an app matching each defined folder block
        - environment: staging
          clusterName: hello-staging
          clusterServer: https://kubernetes.default.svc
          targetNamespace: staging
        - environment: production
          clusterName: hello-production
          clusterServer: https://kubernetes.default.svc
          targetNamespace: production
  template:
    metadata:
      name: 'hello-node-{{environment}}-app'
    spec:
      project: default
      source:
        repoURL: 'https://github.com/biniamgebremichael/argocd.git'
        targetRevision: HEAD
        path: 'gitops/apps/{{environment}}'
      destination:
        # Use server: '{{clusterServer}}' for in-cluster or name: '{{clusterName}}' for multi-cluster
        server: '{{clusterServer}}'
        namespace: '{{targetNamespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true